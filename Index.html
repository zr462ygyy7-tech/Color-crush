<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Color Crush</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(#39a9df,#79c96d);color:#fff;text-align:center;overflow-x:hidden}
#app{width:min(94vw,520px);margin:auto;padding:18px 10px 28px}
.top{display:flex;justify-content:space-between;gap:10px}
.badge{background:#fff3cf;color:#5a351d;border:7px solid #e8ae3e;border-radius:28px;padding:8px 18px;font-size:25px;font-weight:900;box-shadow:0 6px #a66d25;min-width:125px}
h1{font-size:52px;margin:38px 0 6px;color:white;text-shadow:4px 5px #6d168e;font-weight:1000}
.tag{display:inline-block;background:#7620a7;border-radius:35px;padding:12px 28px;font-size:22px;font-weight:900}
.stats{display:flex;justify-content:space-between;font-size:22px;font-weight:900;margin:24px 5px 8px}
.target{background:#ffffff35;border-radius:20px;padding:12px;font-size:20px;font-weight:900;margin-bottom:12px}
#board{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;background:#29245e;border:8px solid #5d207d;border-radius:25px;padding:8px;box-shadow:0 8px #40205d;touch-action:none}
.tile{aspect-ratio:1;border-radius:19px;display:flex;align-items:center;justify-content:center;font-size:clamp(25px,8vw,46px);user-select:none;box-shadow:inset 0 -5px #0002,0 2px #fff4;transition:transform .12s,opacity .15s}
.tile.selected{transform:scale(1.12);outline:4px solid #fff;z-index:2}
.tile.pop{transform:scale(.35);opacity:0}
.msg{font-size:19px;font-weight:900;min-height:28px;margin:18px 0}
.buttons{display:flex;gap:14px}
button{flex:1;border:0;border-radius:24px;padding:18px 8px;font-size:22px;font-weight:900;color:white;box-shadow:0 6px #236f9d;background:#2594d2}
button.restart{background:#f39a18;box-shadow:0 6px #ad6810}
.overlay{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:25px;z-index:10}
.modal{background:white;color:#4d245d;border-radius:28px;padding:25px;width:min(90vw,400px)}
.modal h2{margin-top:0;font-size:32px}
.modal button{margin-top:10px}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="badge">❤️ <span id="lives">5</span></div>
    <div class="badge">🪙 <span id="coins">1250</span></div>
  </div>
  <h1>COLOR CRUSH</h1>
  <div class="tag">طابق الألوان... اكسر المتعة!</div>
  <div class="stats"><span>الحركات <b id="moves">25</b></span><span>⭐ <b id="score">0</b></span><span>المستوى <b id="level">1</b></span></div>
  <div class="target">🎯 الهدف: <span id="target">500</span> نقطة</div>
  <div id="board"></div>
  <div class="msg" id="msg">اسحب قطعة بجانب أخرى لمطابقة 3 أو أكثر!</div>
  <div class="buttons"><button onclick="help()">كيف ألعب؟ ❓</button><button class="restart" onclick="restart()">إعادة 🔄</button></div>
</div>
<div class="overlay" id="overlay"><div class="modal"><h2>🎮 طريقة اللعب</h2><p>اسحب قطعة إلى مكان قطعة مجاورة. إذا أصبحت 3 قطع أو أكثر من النوع نفسه في صف أو عمود، ستختفي وتحصل على نقاط.</p><button onclick="closeHelp()">حسنًا</button></div></div>
<script>
const emojis=["🍋","🍓","🍏","🫐","🍊","🍇"];
const N=8;
let board=[],selected=null,moves=25,score=0,level=1,coins=1250,lives=5,busy=false;

function makeBoard(){
  board=Array.from({length:N},()=>Array.from({length:N},()=>Math.floor(Math.random()*emojis.length)));
  // prevent starting matches
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    while((c>=2&&board[r][c]===board[r][c-1]&&board[r][c]===board[r][c-2]) ||
          (r>=2&&board[r][c]===board[r-1][c]&&board[r][c]===board[r-2][c]))
      board[r][c]=Math.floor(Math.random()*emojis.length);
  }
  draw();
}
function draw(){
  const el=document.getElementById("board");el.innerHTML="";
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const d=document.createElement("div");d.className="tile";d.dataset.r=r;d.dataset.c=c;
    d.textContent=emojis[board[r][c]];
    d.style.background=["#ffcc31","#ef3d62","#4ecb54","#37a9e8","#ff922f","#a44fe0"][board[r][c]];
    if(selected&&selected[0]===r&&selected[1]===c)d.classList.add("selected");
    d.addEventListener("pointerdown",e=>{e.preventDefault();startDrag(r,c,e.clientX,e.clientY)});
    d.addEventListener("pointerup",e=>{e.preventDefault();endDrag(r,c,e.clientX,e.clientY)});
    el.appendChild(d);
  }
  document.getElementById("moves").textContent=moves;
  document.getElementById("score").textContent=score;
  document.getElementById("level").textContent=level;
  document.getElementById("coins").textContent=coins;
}
let drag=null;
function startDrag(r,c,x,y){if(busy||moves<=0)return;drag={r,c,x,y};selected=[r,c];draw()}
async function endDrag(r,c,x,y){
  if(!drag||busy)return;
  const dr=y-drag.y,dc=x-drag.x;
  let tr=drag.r,tc=drag.c;
  if(Math.abs(dr)>20||Math.abs(dc)>20){
    if(Math.abs(dc)>Math.abs(dr))tc+=dc>0?1:-1;else tr+=dr>0?1:-1;
  } else { selected=[r,c]; draw(); drag=null; return; }
  drag=null;
  if(tr<0||tr>=N||tc<0||tc>=N){selected=null;draw();return}
  await swap(drag?.r??r,drag?.c??c,tr,tc);
}
async function swap(r,c,tr,tc){
  busy=true; selected=null;
  const oldR=r,oldC=c;
  // pointer coordinates are stored before drag; recover source from currently selected is unavailable,
  // so infer source from nearest tile by comparing target to last selected. Use global last source.
}
let source=null;
function startDrag(r,c,x,y){if(busy||moves<=0)return;source=[r,c];drag={r,c,x,y};selected=[r,c];draw()}
async function endDrag(r,c,x,y){
  if(!drag||busy)return;
  let tr=drag.r,tc=drag.c,dr=y-drag.y,dc=x-drag.x;
  if(Math.abs(dr)>20||Math.abs(dc)>20){if(Math.abs(dc)>Math.abs(dr))tc+=dc>0?1:-1;else tr+=dr>0?1:-1}
  else{selected=null;drag=null;draw();return}
  const sr=drag.r,sc=drag.c;drag=null;
  if(tr<0||tr>=N||tc<0||tc>=N){selected=null;draw();return}
  if(Math.abs(tr-sr)+Math.abs(tc-sc)!==1){selected=null;draw();return}
  await doSwap(sr,sc,tr,tc);
}
async function doSwap(r,c,tr,tc){
  busy=true;[board[r][c],board[tr][tc]]=[board[tr][tc],board[r][c]];moves--;draw();
  let matches=findMatches();
  if(!matches.length){
    await wait(160);[board[r][c],board[tr][tc]]=[board[tr][tc],board[r][c]];moves++;
    document.getElementById("msg").textContent="هذه الحركة لا تصنع تطابقًا.";
    busy=false;draw();return;
  }
  await resolve(matches);
  if(score>=level*500){level++;moves+=5;coins+=100;document.getElementById("msg").textContent="🎉 مستوى جديد! +5 حركات و +100 عملة";}
  else document.getElementById("msg").textContent="ممتاز! 💥";
  if(moves<=0&&score<level*500){lives=Math.max(0,lives-1);document.getElementById("lives").textContent=lives;document.getElementById("msg").textContent="انتهت الحركات. اضغط إعادة للعب من جديد."}
  busy=false;draw();
}
function findMatches(){
  const set=new Set();
  for(let r=0;r<N;r++){let s=0;for(let c=1;c<=N;c++){if(c<N&&board[r][c]===board[r][s])continue;if(c-s>=3)for(let k=s;k<c;k++)set.add(r*N+k);s=c}}
  for(let c=0;c<N;c++){let s=0;for(let r=1;r<=N;r++){if(r<N&&board[r][c]===board[s][c])continue;if(r-s>=3)for(let k=s;k<r;k++)set.add(k*N+c);s=r}}
  return [...set];
}
async function resolve(matches){
  while(matches.length){
    score+=matches.length*20;coins+=Math.max(1,Math.floor(matches.length/2));
    for(const id of matches)board[Math.floor(id/N)][id%N]=null;
    draw();await wait(180);
    for(let c=0;c<N;c++){
      let vals=[];for(let r=N-1;r>=0;r--)if(board[r][c]!=null)vals.push(board[r][c]);
      for(let r=N-1;r>=0;r--)board[r][c]=vals[N-1-r]??null;
      for(let r=0;r<N;r++)if(board[r][c]==null)board[r][c]=Math.floor(Math.random()*emojis.length);
    }
    draw();await wait(180);matches=findMatches();
  }
}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function restart(){moves=25;score=0;level=1;coins=1250;selected=null;busy=false;document.getElementById("msg").textContent="اسحب قطعة بجانب أخرى لمطابقة 3 أو أكثر!";makeBoard()}
function help(){document.getElementById("overlay").style.display="flex"}
function closeHelp(){document.getElementById("overlay").style.display="none"}
makeBoard();
</script>
</body>
</html>
