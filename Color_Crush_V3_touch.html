<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Color Crush - V3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}
body{background:linear-gradient(#39afe9 0 43%,#7bd16e 100%);color:#fff}
#app{width:min(100vw,500px);margin:auto;padding:14px 12px 25px}
.top{display:flex;justify-content:space-between}.pill{background:#fff3d3;color:#63351d;border:4px solid #e4ad47;border-radius:20px;padding:8px 14px;font-size:20px;font-weight:900;box-shadow:0 5px #a66c2b}
h1{text-align:center;font-size:43px;margin:25px 0 4px;text-shadow:0 4px #5f2086}
.tag{display:table;margin:auto;background:#7123a0;border-radius:22px;padding:9px 18px;font-weight:900}
.stats{display:flex;justify-content:space-between;margin:16px 2px 8px;font-weight:900;font-size:18px}
.goal{background:rgba(255,255,255,.2);border-radius:12px;padding:7px 10px;text-align:center;margin-bottom:8px}
.board{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;background:#202c61;border:6px solid #5a2b7d;border-radius:18px;padding:5px;box-shadow:0 7px #3b4779;touch-action:none}
.tile{aspect-ratio:1;border-radius:23%;display:grid;place-items:center;font-size:clamp(21px,7vw,34px);box-shadow:inset 0 4px rgba(255,255,255,.42),0 3px rgba(0,0,0,.22);transition:transform .12s,opacity .15s}
.tile.sel{transform:scale(1.13);outline:4px solid #fff}.r{background:#ef4663}.y{background:#ffc82c}.g{background:#58ca4e}.b{background:#39a9eb}.p{background:#a65be8}.o{background:#ff8b2b}
.special{font-size:28px;text-shadow:0 2px #333}
.msg{text-align:center;font-weight:900;min-height:28px;margin:10px 0}
.actions{display:flex;gap:10px}.actions button,.card button{flex:1;border:0;border-radius:18px;padding:13px;font-size:18px;font-weight:900;color:#fff;box-shadow:0 5px rgba(0,0,0,.2)}
#restart{background:#ed921e}#help{background:#288fd0}
#overlay{position:fixed;inset:0;background:rgba(20,10,45,.72);display:none;align-items:center;justify-content:center;padding:20px}
.card{width:min(92vw,380px);background:#f1d6fb;color:#501864;border:5px solid #72249e;border-radius:28px;padding:24px;text-align:center;box-shadow:0 10px #38184b}
.card h2{font-size:31px;margin:4px}.stars{font-size:42px;margin:8px}.card button{width:100%;background:#55c92d}
</style>
</head>
<body>
<div id="app">
<div class="top"><div class="pill">🪙 <span id="coins">1250</span></div><div class="pill">❤️ <span id="lives">5</span></div></div>
<h1>COLOR CRUSH</h1><div class="tag">طابق الألوان... اكسر المتعة!</div>
<div class="stats"><span>المستوى <b id="level">1</b></span><span>⭐ <b id="score">0</b></span><span>الحركات <b id="moves">25</b></span></div>
<div class="goal">🎯 الهدف: <b id="target">500</b> نقطة</div>
<div id="board" class="board"></div>
<div id="msg" class="msg">اسحب أي قطعة باتجاه قطعة بجانبها</div>
<div class="actions"><button id="restart">🔄 إعادة</button><button id="help">❓ كيف ألعب؟</button></div>
</div>

<div id="overlay"><div class="card">
<h2 id="winTitle">🎉 أحسنت!</h2><div class="stars">⭐⭐⭐</div>
<p id="winText">أكملت المستوى بنجاح</p><h2 id="finalScore"></h2>
<button id="next">المستوى التالي</button>
</div></div>

<script>
const W=8, pieces=[["r","🍓"],["y","🍋"],["g","🍏"],["b","🔵"],["p","🍇"],["o","🍊"]];
let a=[],special={},selected=-1,startX=0,startY=0,startI=-1,score=0,moves=25,level=1,coins=1250,lives=5,busy=false;
const $=x=>document.getElementById(x), sleep=ms=>new Promise(r=>setTimeout(r,ms));
function rnd(){return Math.floor(Math.random()*pieces.length)}
function ok(i,t){let r=Math.floor(i/W),c=i%W;return !(c>1&&a[i-1]===t&&a[i-2]===t)&&!(r>1&&a[i-W]===t&&a[i-2*W]===t)}
function start(){
 a=[];special={};score=0;moves=25;selected=-1;busy=false;
 for(let i=0;i<W*W;i++){let t;do{t=rnd()}while(!ok(i,t));a.push(t)}
 $("target").textContent=level*500;$("msg").textContent="اسحب أي قطعة باتجاه قطعة بجانبها";draw()
}
function draw(){
 const board=$("board");board.innerHTML="";
 a.forEach((t,i)=>{
  let d=document.createElement("div");
  d.className="tile "+pieces[t][0]+(selected===i?" sel":"")+(special[i]?" special":"");
  d.textContent=special[i]||pieces[t][1];d.dataset.i=i;board.appendChild(d)
 });
 $("score").textContent=score;$("moves").textContent=moves;$("level").textContent=level;$("coins").textContent=coins;$("lives").textContent=lives
}
function idxFromPoint(x,y){
 const r=$("board").getBoundingClientRect(),col=Math.floor((x-r.left)/(r.width/W)),row=Math.floor((y-r.top)/(r.height/W));
 return row>=0&&row<W&&col>=0&&col<W?row*W+col:-1
}
$("board").addEventListener("pointerdown",e=>{
 if(busy)return;startX=e.clientX;startY=e.clientY;startI=idxFromPoint(e.clientX,e.clientY);selected=startI;draw()
});
$("board").addEventListener("pointerup",e=>{
 if(busy||startI<0)return;
 let dx=e.clientX-startX,dy=e.clientY-startY;
 if(Math.max(Math.abs(dx),Math.abs(dy))<15){selected=startI;draw();return}
 let end=startI;
 if(Math.abs(dx)>Math.abs(dy))end+=dx>0?1:-1;else end+=dy>0?W:-W;
 if(end>=0&&end<W*W&&Math.abs(Math.floor(startI/W)-Math.floor(end/W))+Math.abs(startI%W-end%W)===1) swap(startI,end);
 else {selected=-1;draw()}
});
function swap(x,y){
 busy=true;selected=-1;[a[x],a[y]]=[a[y],a[x]];[special[x],special[y]]=[special[y],special[x]];draw();
 setTimeout(async()=>{
  if(!find().length){[a[x],a[y]]=[a[y],a[x]];[special[x],special[y]]=[special[y],special[x]];$("msg").textContent="هذه الحركة لا تصنع تطابقًا.";busy=false;draw();return}
  await resolve();moves--;
  if(score>=level*500){busy=false;win();return}
  if(moves<=0){lives=Math.max(0,lives-1);$("msg").textContent="انتهت الحركات — اضغط إعادة"}else $("msg").textContent="ممتاز! استمر!";
  busy=false;draw()
 },100)
}
function find(){
 let s=new Set(),groups=[];
 for(let r=0;r<W;r++){let st=0;for(let c=1;c<=W;c++){if(c<W&&a[r*W+c]===a[r*W+st])continue;if(c-st>=3){let g=[];for(let k=st;k<c;k++){s.add(r*W+k);g.push(r*W+k)}groups.push(g)}st=c}}
 for(let c=0;c<W;c++){let st=0;for(let r=1;r<=W;r++){if(r<W&&a[r*W+c]===a[st*W+c])continue;if(r-st>=3){let g=[];for(let k=st;k<r;k++){s.add(k*W+c);g.push(k*W+c)}groups.push(g)}st=r}}
 return {cells:[...s],groups}
}
async function resolve(){
 let z=find();
 while(z.cells.length){
  z.groups.forEach(g=>{if(g.length>=5)special[g[2]]="🌈";else if(g.length===4)special[g[1]]="💥"});
  score+=z.cells.length*10;coins+=Math.max(1,Math.floor(z.cells.length/3));
  z.cells.forEach(i=>{a[i]=null;delete special[i]});draw();await sleep(180);
  for(let c=0;c<W;c++){
   let vals=[],sp=[];
   for(let r=W-1;r>=0;r--)if(a[r*W+c]!==null){vals.push(a[r*W+c]);sp.push(special[r*W+c]||null)}
   for(let r=W-1;r>=0;r--){let q=W-1-r;a[r*W+c]=vals[q]??rnd();if(vals[q]!==undefined&&sp[q])special[r*W+c]=sp[q];else delete special[r*W+c]}
  }
  draw();await sleep(160);z=find()
 }
}
function win(){$("finalScore").textContent=score+" نقطة";$("overlay").style.display="flex"}
$("next").onclick=()=>{$("overlay").style.display="none";level++;start()}
$("restart").onclick=start;
$("help").onclick=()=>alert("اسحب القطعة بإصبعك نحو قطعة بجانبها. طابق 3 أو أكثر لتحصل على نقاط. 4 قطع تعطي 💥 و5 قطع تعطي 🌈.");
start();
</script>
</body>
</html>
